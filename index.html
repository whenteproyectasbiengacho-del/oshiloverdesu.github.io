<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Firing All Rounds</title>

    <style>

        /* =========================
           FONDO
           ========================= */

        body {
            margin: 0;
            height: 100vh;

            background-image: url("fondo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* =========================
           TEXTO DEL CENTRO
           ========================= */

        .texto-centro {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 55%;

            text-align: center;

            font-family: Impact, "Arial Black", sans-serif;

            font-size: 32px;

            font-weight: bold;

            color: yellow;

            -webkit-text-stroke: 1.5px black;

            text-shadow:
                3px 3px 0px black,
                5px 5px 0px rgba(0, 0, 0, 0.5);

            z-index: 5;

            pointer-events: none;
        }


        /* =========================
           IMÁGENES DE LA DERECHA
           ========================= */

        .derecha {

            position: absolute;

            right: 0;
            top: 0;

            width: 30%;
            height: 100vh;

            display: flex;

            flex-direction: column;

            z-index: 2;
        }


        .imagen {

            width: 100%;
            height: 50%;

            object-fit: cover;
        }


        /* =========================
           BOTÓN
           ========================= */

        .boton-container {

            position: absolute;

            left: 5%;
            bottom: 5%;

            width: 400px;

            text-align: center;

            cursor: pointer;

            z-index: 10;
        }


        .boton {

            width: 100%;

            display: block;

            transition: transform 0.15s;
        }


        /* BOTÓN AL PASAR EL MOUSE */

        .boton-container:hover .boton {

            transform: scale(1.08);

        }


        /* =========================
           TEXTO DEL BOTÓN
           ========================= */

        .texto-boton {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 100%;

            font-family: Impact, "Arial Black", sans-serif;

            font-size: 38px;

            font-weight: bold;

            color: yellow;

            -webkit-text-stroke: 2px black;

            text-shadow:
                4px 4px 0px black,
                6px 6px 0px rgba(0, 0, 0, 0.5);

            pointer-events: none;

            white-space: nowrap;
        }

    </style>

</head>


<body>


    <!-- =========================
         TEXTO DEL CENTRO
         ========================= -->

    <div class="texto-centro">

        Think it over three times, hard,
        before talking to me.
        I have ripped out enough tongues today.

    </div>


    <!-- =========================
         BOTÓN
         ========================= -->

    <div class="boton-container" onclick="sonar()">

        <img
            class="boton"
            src="boton.gif"
        >

        <div class="texto-boton">

            firing all rounds!!!

        </div>

    </div>


    <!-- =========================
         IMÁGENES DERECHA
         ========================= -->

    <div class="derecha">

        <img
            class="imagen"
            src="imagen1.gif"
        >

        <img
            class="imagen"
            src="imagen2.gif"
        >

    </div>


    <!-- =========================
         SONIDO DEL BOTÓN
         ========================= -->

    <audio
        id="sonidoBoton"
        src="click.mp3"
    ></audio>


    <!-- =========================
         MÚSICA DE FONDO
         ========================= -->

    <audio
        id="musica"
        src="musica.mp3"
        autoplay
        loop
    ></audio>


    <script>


        /* =========================
           MÚSICA AL ABRIR
           ========================= */

        window.addEventListener("load", function() {

            let musica =
                document.getElementById("musica");

            musica.volume = 0.5;

            musica.play().catch(function() {

                console.log(
                    "El navegador bloqueó el autoplay."
                );

            });

        });


        /* =========================
           BOTÓN
           ========================= */

        function sonar() {

            let sonido =
                document.getElementById("sonidoBoton");

            sonido.currentTime = 0;

            sonido.play();


            /* Inicia la música si Chrome
               la había bloqueado */

            let musica =
                document.getElementById("musica");

            if (musica.paused) {

                musica.play();

            }

        }

    </script>


</body>

</html>
